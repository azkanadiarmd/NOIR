        odor resistance, stretch, and tropical suitability.

    <div class="page-body">
      <div class="material-grid" id="materialGrid">
        <!-- Cards are rendered by JS below -->
      </div>

  <script src="../js/main.js"></script>
  <script>

     * Each material has: name, type, tags[], ratings{}
     */
    const materials = [
      {

        ratings: {
          'Breathability':     68,
          'Moisture-Wicking':  92,
          'Odor Resistance':   45,
          'Stretch (natural)': 20,
          'Tropical Suitability': 75,
        }
      },
      {
        name: 'Nylon',
        type: 'Synthetic',
        tags: ['lightweight', 'abrasion-resistant', 'quick-dry'],
        tagTypes: ['good', 'good', 'good'],
        ratings: {
          'Breathability':     70,
          'Moisture-Wicking':  80,
          'Odor Resistance':   50,
          'Stretch (natural)': 25,
          'Tropical Suitability': 78,
        }
      },
      {
        name: 'Spandex / Elastane',
        type: 'Synthetic (stretch)',
        tags: ['4-way stretch', 'compression', 'blend only'],
        tagTypes: ['good', 'good', 'neut'],
        ratings: {
          'Breathability':     55,
          'Moisture-Wicking':  60,
          'Odor Resistance':   40,
          'Stretch (natural)': 100,
          'Tropical Suitability': 60,

      {

        tags: ['soft', 'antibacterial', 'eco-friendly'],
        tagTypes: ['good', 'good', 'good'],
        ratings: {

          'Odor Resistance':   82,
          'Stretch (natural)': 15,
          'Tropical Suitability': 88,
        }
      },
      {
        name: 'Merino Wool',
        type: 'Natural',
        tags: ['odor-resistant', 'thermoregulating', 'heavy'],
        tagTypes: ['good', 'good', 'warn'],
        ratings: {
          'Breathability':     85,
          'Moisture-Wicking':  72,
          'Odor Resistance':   95,
          'Stretch (natural)': 30,
          'Tropical Suitability': 50,
        }
      },
      {
        name: 'Modal',
        type: 'Semi-synthetic (beechwood)',
        tags: ['ultra-soft', 'breathable', 'low durability'],
        tagTypes: ['good', 'good', 'warn'],
        ratings: {
          'Breathability':     84,

        }
      },
      {
        name: 'Tencel (Lyocell)',

        tagTypes: ['good', 'good', 'neut'],
        ratings: {
          'Breathability':     82,

          'Odor Resistance':   70,
          'Stretch (natural)': 12,
          'Tropical Suitability': 82,
        }
      },
      {
        name: 'Recycled PET',
        type: 'Recycled Synthetic',
        tags: ['eco-friendly', 'moisture-wicking', 'same as poly'],
        tagTypes: ['good', 'good', 'neut'],
        ratings: {
          'Breathability':     66,

          'Stretch (natural)': 18,

        }

      {
        name: 'Cotton',

        tags: ['comfortable', 'absorbs sweat', 'slow-dry'],
        tagTypes: ['good', 'warn', 'bad'],
        ratings: {
          'Breathability':     72,
          'Moisture-Wicking':  25,
          'Odor Resistance':   48,
          'Stretch (natural)': 8,
          'Tropical Suitability': 35,
        }
      },
    ];

    function renderMaterials(data) {
      const grid = document.getElementById('materialGrid');
      grid.innerHTML = data.map(m => `
        <div class="material-card">
          <div class="mat-name">${m.name}</div>
          <div class="mat-type">${m.type}</div>
          <div class="mat-tags">
            ${m.tags.map((t, i) => `<span class="mat-tag tag-${m.tagTypes[i]}">${t}</span>`).join('')}
          </div>
          <div class="mat-rating-row">
            ${Object.entries(m.ratings).map(([label, val]) => `
              <div class="mat-rating">
                <span class="mat-rating-label">${label}</span>
                <div class="mat-bar"><div class="mat-fill" style="width:${val}%"></div></div>
                <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);width:32px;text-align:right">${val}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    renderMaterials(materials);
  </script>
